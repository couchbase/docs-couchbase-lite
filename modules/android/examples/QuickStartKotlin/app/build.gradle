plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Set true to use mavenLocal instead of Proget
def USE_LOCAL_MAVEN = project.hasProperty("useLocalMaven")

android {
    namespace "com.couchbase.android.quickstart"

    compileSdk 33

    defaultConfig {
        applicationId "com.couchbase.android.quickstart"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions { jvmTarget = "11" }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.4.6"
    }
}

repositories {
    if (USE_LOCAL_MAVEN) {
        mavenLocal()
    }

    maven {
        url "https://proget.sc.couchbase.com/maven2/internalmaven/"
        content { includeGroupByRegex "com\\.couchbase\\.lite.*" }
    }

    maven {
        url "https://mobile.maven.couchbase.com/maven2/dev/"
        content { includeGroupByRegex "com\\.couchbase\\.lite.*" }
    }

    google()
    mavenCentral()
}

dependencies {
    // Kotlin core
    implementation 'androidx.core:core-ktx:1.9.0'

    // Compose
    implementation platform('androidx.compose:compose-bom:2023.06.01')
    implementation 'androidx.activity:activity-compose:1.7.2'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Couchbase
    implementation "com.couchbase.lite:couchbase-lite-android-ktx:${CBL_VERSION}"
}
