import java.util.Properties

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Set true to use mavenLocal instead of Proget
def USE_LOCAL_MAVEN = project.hasProperty("useLocalMaven")

// Sync credentials: read from <project>/local.properties (gitignored) if present,
// otherwise fall back to the environment. Never hardcode credentials here.
def syncProps = new Properties()
def syncPropsFile = file('../local.properties')
if (syncPropsFile.exists()) {
    syncPropsFile.withInputStream { syncProps.load(it) }
}
def cblBaseUrl = syncProps.getProperty('CBL_BASE_URL') ?: System.getenv('CBL_BASE_URL') ?: ""
def cblEndpoint = syncProps.getProperty('CBL_ENDPOINT') ?: System.getenv('CBL_ENDPOINT') ?: ""
def cblUser = syncProps.getProperty('CBL_USER') ?: System.getenv('CBL_USER') ?: ""
def cblPassword = syncProps.getProperty('CBL_PASSWORD') ?: System.getenv('CBL_PASSWORD') ?: ""

android {
    namespace "com.couchbase.android.cloudsync"

    compileSdk 33

    defaultConfig {
        applicationId "com.couchbase.android.cloudsync"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "CBL_BASE_URL", "\"${cblBaseUrl}\""
        buildConfigField "String", "CBL_ENDPOINT", "\"${cblEndpoint}\""
        buildConfigField "String", "CBL_USER", "\"${cblUser}\""
        buildConfigField "String", "CBL_PASSWORD", "\"${cblPassword}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions { jvmTarget = "11" }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.4.6"
    }
}

repositories {
    if (USE_LOCAL_MAVEN) {
        mavenLocal()
    }

    maven {
        url "https://proget.sc.couchbase.com/maven2/internalmaven/"
        content { includeGroupByRegex "com\\.couchbase\\.lite.*" }
    }

    maven {
        url "https://mobile.maven.couchbase.com/maven2/dev/"
        content { includeGroupByRegex "com\\.couchbase\\.lite.*" }
    }

    google()
    mavenCentral()
}

dependencies {
    // Kotlin core
    implementation 'androidx.core:core-ktx:1.9.0'

    // Compose
    implementation platform('androidx.compose:compose-bom:2023.06.01')
    implementation 'androidx.activity:activity-compose:1.7.2'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Couchbase
    implementation "com.couchbase.lite:couchbase-lite-android-ktx:${CBL_VERSION}"
}
